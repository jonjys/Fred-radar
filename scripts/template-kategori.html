<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{TITLE}}</title>
  <meta name="description" content="{{DESCRIPTION}}" />
  <link rel="canonical" href="{{CANONICAL_URL}}" />
  <link rel="alternate" hreflang="en" href="{{CANONICAL_URL}}" />
  <link rel="alternate" hreflang="sv" href="{{CANONICAL_URL_SV}}" />
  <link rel="alternate" hreflang="x-default" href="{{CANONICAL_URL}}" />

  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="FRED-Radar" />
  <meta property="og:url" content="{{CANONICAL_URL}}" />
  <meta property="og:title" content="{{TITLE}}" />
  <meta property="og:description" content="{{DESCRIPTION}}" />
  <meta property="og:locale" content="en_US" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="{{TITLE}}" />
  <meta name="twitter:description" content="{{DESCRIPTION}}" />

  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📡</text></svg>" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/css/style.css" />

  <script type="application/ld+json">
{{JSON_LD}}
  </script>
</head>
<body>
  <div id="site-header"></div>

  <main>
    <section class="hero" style="padding-top:56px; padding-bottom:36px;">
      <div class="wrap">
        <span class="eyebrow">{{CATEGORY_ICON}} {{CATEGORY_NAME}}</span>
        <h1 style="font-size:clamp(1.8rem,4vw,2.6rem);">{{CATEGORY_NAME}}</h1>
        <p class="lead">{{CATEGORY_INTRO}}</p>
      </div>
    </section>

    <section style="padding-top:0;">
      <div class="wrap">
        <p class="quiz-note" style="margin-bottom:18px;">{{TOOL_COUNT}} tools compared</p>
        <div class="tool-grid">
{{TOOL_CARDS}}
        </div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>
  <script src="/assets/js/i18n.js"></script>
  <script src="/assets/js/tool-card-template.js"></script>
  <script src="/assets/js/tools-data.js"></script>
  <script src="/assets/js/partials.js"></script>
  <script src="/assets/js/analytics.js"></script>
</body>
</html>
