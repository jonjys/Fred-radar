<!doctype html>
<!--
  Källa för og-image.png (1200×630). Redigera den här filen och rendera om
  vid ändringar – se README ("SEO" → "OG-bild") för exakt kommando.
  Ingen extern nätverksåtkomst (fonts m.m.) förutsätts – allt är inline.
-->
<html lang="sv">
<head>
<meta charset="utf-8" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
    background: #0b0d12;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .bg {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(720px 480px at 15% 8%, rgba(124,158,255,0.28), transparent 60%),
      radial-gradient(560px 420px at 92% 96%, rgba(124,158,255,0.14), transparent 65%),
      #0b0d12;
  }
  .grid {
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.035) 1px, transparent 1px);
    background-size: 48px 48px;
    mask-image: linear-gradient(to bottom, black, transparent 85%);
  }
  .content {
    position: relative;
    width: 1200px;
    height: 630px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 0 88px;
  }
  .eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    align-self: flex-start;
    background: rgba(124,158,255,0.12);
    color: #7c9eff;
    border: 1px solid rgba(124,158,255,0.32);
    padding: 9px 20px;
    border-radius: 999px;
    font-size: 22px;
    font-weight: 700;
    margin-bottom: 34px;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 18px;
    margin-bottom: 22px;
  }
  .dot {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: #7c9eff;
    box-shadow: 0 0 34px 6px rgba(124,158,255,0.65);
  }
  .brand-name {
    font-size: 58px;
    font-weight: 800;
    color: #f2f4f8;
    letter-spacing: -0.02em;
  }
  h1 {
    font-size: 64px;
    font-weight: 800;
    line-height: 1.08;
    color: #f2f4f8;
    letter-spacing: -0.02em;
    max-width: 920px;
    margin-bottom: 26px;
  }
  p.sub {
    font-size: 28px;
    color: #a2a9ba;
    max-width: 780px;
    line-height: 1.4;
    margin-bottom: 46px;
  }
  .stats {
    display: flex;
    gap: 46px;
  }
  .stat {
    display: flex;
    flex-direction: column;
  }
  .stat .num {
    font-size: 34px;
    font-weight: 800;
    color: #f2f4f8;
  }
  .stat .lbl {
    font-size: 18px;
    color: #6b7386;
    margin-top: 2px;
  }
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="grid"></div>
  <div class="content">
    <span class="eyebrow">🇸🇪 Byggt för svenska &amp; nordiska förhållanden</span>
    <div class="brand">
      <span class="dot"></span>
      <span class="brand-name">Radar</span>
    </div>
    <h1>Hitta rätt AI-verktyg på 60 sekunder</h1>
    <p class="sub">Smarta rekommendationer &amp; jämförelser av AI- och produktivitetsverktyg – oberoende, GDPR-vägt, anpassat för Norden.</p>
    <div class="stats">
      <div class="stat"><span class="num">20</span><span class="lbl">verktyg jämförda</span></div>
      <div class="stat"><span class="num">3</span><span class="lbl">kategorier</span></div>
      <div class="stat"><span class="num">100%</span><span class="lbl">oberoende ranking</span></div>
    </div>
  </div>
</body>
</html>
