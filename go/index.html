<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Vidarebefordrar … | Radar</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="stylesheet" href="/assets/css/style.css" />
</head>
<body>
  <!--
    Central utgångspunkt för ALLA klick ut från Radar (/go/?tool=<id>).

    Varför: alla utgående länkar på sajten pekar hit i stället för direkt till
    leverantören. Det gör det möjligt att:
      1. Byta affiliate-URL för ett verktyg på EN plats (data/tools.json →
         fältet "affiliateUrl") utan att leta igenom varje HTML-sida.
      2. Lägga till klickspårning/analytics senare utan att röra länkarna
         på index/quiz/kategorisidorna.
      3. Visa en tydlig annonsdisclosure innan användaren lämnar sajten.

    Om ?tool=<id> saknas eller inte finns i tools.json skickas besökaren
    till startsidan istället för att fastna på en trasig sida.
  -->
  <main class="empty-state" style="padding-top:120px;">
    <p style="font-size:2rem;">📡</p>
    <p id="msg">Skickar dig vidare …</p>
    <p class="quiz-note">Öppnas inte sidan automatiskt? <a id="fallbackLink" href="/" style="color:var(--accent);">Klicka här</a>.</p>
  </main>
  <script>
    (async function () {
      const params = new URLSearchParams(window.location.search);
      const toolId = params.get("tool");
      const msg = document.getElementById("msg");
      const fallback = document.getElementById("fallbackLink");

      if (!toolId) {
        window.location.replace("/");
        return;
      }

      try {
        const tools = await fetch("/data/tools.json").then((r) => r.json());
        const tool = tools.find((t) => t.id === toolId);

        if (!tool) {
          msg.textContent = "Vi hittade inte det verktyget.";
          fallback.href = "/";
          return;
        }

        const dest = tool.affiliateUrl || tool.website;
        msg.textContent = "Skickar dig vidare till " + tool.name + " …";
        fallback.textContent = "Klicka här om du inte skickas vidare automatiskt";
        fallback.href = dest;
        setTimeout(() => window.location.replace(dest), 400);
      } catch (e) {
        window.location.replace("/");
      }
    })();
  </script>
</body>
</html>
