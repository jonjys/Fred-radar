<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title data-i18n="pages.err.title">Page not found | FRED-Radar</title>
  <meta name="description" content="The page you looked for does not exist." />
  <meta name="robots" content="noindex" />
  <link rel="stylesheet" href="/assets/css/style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📡</text></svg>" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
</head>
<body>
  <div id="site-header"></div>
  <main>
    <section class="hero" style="padding-top:80px;padding-bottom:60px;text-align:center;">
      <div class="wrap">
        <span class="eyebrow">404</span>
        <h1 style="font-size:clamp(2rem,5vw,3rem);" data-i18n="pages.err.h1">This page does not exist</h1>
        <p class="lead" style="max-width:420px;margin:16px auto 28px;" data-i18n="pages.err.lead">
          The link may be old or mistyped. Here is the way back:
        </p>
        <div style="display:flex;flex-wrap:wrap;gap:12px;justify-content:center;">
          <a class="btn btn-primary" id="eHome" href="/" data-i18n="pages.err.home">Home</a>
          <a class="btn btn-ghost" id="eQuiz" href="/quiz.html" data-i18n="pages.err.quiz">Take the quiz</a>
          <a class="btn btn-ghost" id="eBest" href="/basta.html" data-i18n="pages.err.best">Best lists</a>
          <a class="btn btn-ghost" id="eAlts" href="/alternativ.html" data-i18n="pages.err.alts">Alternatives</a>
        </div>
      </div>
    </section>
  </main>
  <div id="site-footer"></div>
  <script src="/assets/js/i18n-dict.js"></script>
  <script src="/assets/js/i18n.js"></script>
  <script src="/assets/js/partials.js"></script>
  <script>
    function wire() {
      var I = window.FredI18n;
      if (!I) return;
      document.getElementById("eHome").href = I.withLang("/", I.lang);
      document.getElementById("eQuiz").href = I.withLang("/quiz.html", I.lang);
      document.getElementById("eBest").href = I.withLang("/basta.html", I.lang);
      document.getElementById("eAlts").href = I.withLang("/alternativ.html", I.lang);
    }
    if (window.FredI18n && window.FredI18n.whenReady) window.FredI18n.whenReady(wire);
  </script>
</body>
</html>
